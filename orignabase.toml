# OrignaBase Configuration
# Environment variables (OB_*) override these values.

host = "0.0.0.0"
port = 8080

[database]
endpoint = "localhost:8000"
namespace = "orignabase"
name = "main"
username = "root"
password = "root"

[auth]
jwt_secret = "CHANGE_ME_IN_PRODUCTION"
access_token_ttl_secs = 900       # 15 minutes
refresh_token_ttl_secs = 604800   # 7 days

[security]
rules_path = "rules.ob"

