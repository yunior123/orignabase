# OrignaBase Docker Compose
# Usage:
#   Dev:     cp .env.dev .env && docker compose up -d
#   Staging: cp .env.staging .env && docker compose up -d
#   Prod:    cp .env.prod .env && docker compose up -d

services:
  surrealdb:
    image: surrealdb/surrealdb:v2
    command: start --user ${SURREALDB_USER} --pass ${SURREALDB_PASS} rocksdb:/data/database.db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - surrealdb_data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  meilisearch:
    image: getmeili/meilisearch:v1.12
    ports:
      - "127.0.0.1:7700:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    volumes:
      - meili_data:/meili_data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  orignabase:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      OB_HOST: ${OB_HOST}
      OB_PORT: ${OB_PORT}
      OB_DATABASE__ENDPOINT: ${OB_DATABASE__ENDPOINT}
      OB_DATABASE__USERNAME: ${OB_DATABASE__USERNAME}
      OB_DATABASE__PASSWORD: ${OB_DATABASE__PASSWORD}
      OB_DATABASE__NAMESPACE: ${OB_DATABASE__NAMESPACE}
      OB_DATABASE__NAME: ${OB_DATABASE__NAME}
      OB_AUTH__JWT_SECRET: ${OB_AUTH__JWT_SECRET}
      OB_AUTH__ACCESS_TOKEN_TTL_SECS: ${OB_AUTH__ACCESS_TOKEN_TTL_SECS}
      OB_AUTH__REFRESH_TOKEN_TTL_SECS: ${OB_AUTH__REFRESH_TOKEN_TTL_SECS}
      OB_SECURITY__RULES_PATH: ${OB_SECURITY__RULES_PATH}
    depends_on:
      - surrealdb
      - meilisearch
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  caddy:
    image: caddy:2.8-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/www/orignagta:/var/www/orignagta:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - orignabase
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  surrealdb_data:
  meili_data:
  caddy_data:
  caddy_config:
