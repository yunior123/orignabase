services:
  surrealdb:
    image: surrealdb/surrealdb:v2
    command: start --user root --pass root rocksdb:/data/database.db
    ports:
      - "8000:8000"
    volumes:
      - surrealdb_data:/data
    deploy:
      resources:
        limits:
          memory: 256M

  meilisearch:
    image: getmeili/meilisearch:v1.12
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-change-me-in-production}
    volumes:
      - meili_data:/meili_data
    deploy:
      resources:
        limits:
          memory: 256M

  orignabase:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      OB_DATABASE__ENDPOINT: ws://surrealdb:8000
      OB_DATABASE__USERNAME: root
      OB_DATABASE__PASSWORD: root
      OB_DATABASE__NAMESPACE: orignabase
      OB_DATABASE__NAME: main
      OB_AUTH__JWT_SECRET: ${OB_AUTH__JWT_SECRET:-change-me-in-production}
    depends_on:
      - surrealdb
      - meilisearch
    deploy:
      resources:
        limits:
          memory: 512M

  # --- Cluster Mode (uncomment to enable multi-node) ---
  # nats:
  #   image: nats:2.10
  #   command: --jetstream --store_dir /data
  #   ports:
  #     - "4222:4222"
  #   volumes:
  #     - nats_data:/data
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 128M

  # --- TiKV Mode (uncomment to replace RocksDB with TiKV) ---
  # To use TiKV instead of embedded RocksDB:
  # 1. Replace surrealdb command with:
  #    command: start --user root --pass root tikv://pd:2379
  # 2. Add TiKV PD + TiKV nodes (see TiKV docs)
  # 3. Set OB_CLUSTER__ENABLED=true and OB_CLUSTER__NATS_URL=nats://nats:4222

volumes:
  surrealdb_data:
  meili_data:
  # nats_data:
