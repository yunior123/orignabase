services:
  surrealdb:
    image: surrealdb/surrealdb:v2
    command: start --user root --pass root rocksdb:/data/database.db
    ports:
      - "8000:8000"
    volumes:
      - surrealdb_data:/data
    deploy:
      resources:
        limits:
          memory: 256M

  meilisearch:
    image: getmeili/meilisearch:v1.12
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-change-me-in-production}
    volumes:
      - meili_data:/meili_data
    deploy:
      resources:
        limits:
          memory: 256M

  orignabase:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      OB_DATABASE__ENDPOINT: ws://surrealdb:8000
      OB_DATABASE__USERNAME: root
      OB_DATABASE__PASSWORD: root
      OB_DATABASE__NAMESPACE: orignabase
      OB_DATABASE__NAME: main
      OB_AUTH__JWT_SECRET: ${OB_AUTH__JWT_SECRET:-change-me-in-production}
    depends_on:
      - surrealdb
      - meilisearch
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  surrealdb_data:
  meili_data:
