# CI-optimized: no volumes, no Caddy, kv-mem for speed
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: orignabase
      POSTGRES_PASSWORD: orignabase_dev
      POSTGRES_DB: orignabase
    ports:
      - "5432:5432"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orignabase"]
      interval: 5s
      timeout: 3s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: test_master_key
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  orignabase:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      OB_BASE_URL: http://orignabase:8080
      OB_DATABASE__URL: REDACTED_SECRET/orignabase
      OB_SEARCH__URL: http://meilisearch:7700
      OB_SEARCH__API_KEY: test_master_key
      OB_AUTH__JWT_SECRET: test_jwt_secret_for_ci_only
      OB_AUTH__ACCESS_TOKEN_TTL_SECS: "900"
      OB_AUTH__REFRESH_TOKEN_TTL_SECS: "604800"
      OB_AUTH__GOOGLE_CLIENT_ID: ${OB_AUTH__GOOGLE_CLIENT_ID:-}
      OB_AUTH__GOOGLE_CLIENT_SECRET: ${OB_AUTH__GOOGLE_CLIENT_SECRET:-}
      OB_TEST_MODE: "1"
      OB_SECURITY__RULES_PATH: /etc/orignabase/rules.test.ob
      OB_HOST: 0.0.0.0
      OB_PORT: "8080"
      OB_SECRETS__STRIPE_SECRET_KEY: ${OB_SECRETS__STRIPE_SECRET_KEY:-}
      OB_SECRETS__STRIPE_WEBHOOK_SECRET: ${OB_SECRETS__STRIPE_WEBHOOK_SECRET:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
