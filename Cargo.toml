[workspace]
resolver = "2"
members = [
    "crates/ob-mcp",
    "crates/orignabase",
    "crates/ob-core",
    "crates/ob-database",
    "crates/ob-auth",
    "crates/ob-graphql",
    "crates/ob-security",
    "crates/ob-realtime",
    "crates/ob-storage",
    "crates/ob-search",
    "crates/ob-admin",
    "crates/ob-functions",
    "crates/ob-analytics",
    "crates/ob-notifications",
    "crates/ob-handlers",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/yunior123/orignabase"
rust-version = "1.85"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["ws", "macros"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "trace", "timeout", "limit", "fs", "catch-panic", "set-header", "request-id"] }

# GraphQL
async-graphql = { version = "7", features = ["chrono", "uuid"] }
async-graphql-axum = "7"

# Database
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }

# Auth
argon2 = "0.5"
jsonwebtoken = "9"
rand = "0.8"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Security rules parser
pest = "2.7"
pest_derive = "2.7"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Config
dotenvy = "0.15"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Testing
tokio-test = "0.4"
proptest = "1"
insta = { version = "1", features = ["json", "yaml"] }
rstest = "0.25"
test-case = "3"

# Benchmarks
criterion = { version = "0.5", features = ["html_reports"] }

# Workspace crates
ob-core = { path = "crates/ob-core" }
ob-database = { path = "crates/ob-database" }
ob-auth = { path = "crates/ob-auth" }
ob-graphql = { path = "crates/ob-graphql" }
ob-security = { path = "crates/ob-security" }
ob-realtime = { path = "crates/ob-realtime" }
ob-storage = { path = "crates/ob-storage" }
ob-search = { path = "crates/ob-search" }
ob-admin = { path = "crates/ob-admin" }
ob-functions = { path = "crates/ob-functions" }
ob-analytics = { path = "crates/ob-analytics" }
ob-notifications = { path = "crates/ob-notifications" }
ob-mcp = { path = "crates/ob-mcp" }
ob-handlers = { path = "crates/ob-handlers" }

# Crypto (for signed URLs)
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"

# File handling
tokio-util = { version = "0.7", features = ["io"] }

# HTTP client (for Meilisearch)
reqwest = { version = "0.12", features = ["json"] }

# Async streams
futures-util = "0.3"

# NATS (cluster messaging)
async-nats = "0.38"

# Notify (file watcher for hot-reload)
notify = "7"

# Hex encoding
hex = "0.4"

# TOTP / MFA
totp-rs = { version = "5", features = ["gen_secret", "otpauth", "qr"] }

# Encryption (TOTP secrets at rest)
aes-gcm = "0.10"

# Email / SMTP
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "hostname", "builder", "pool"] }

# Image processing
image = "0.25"

# File type detection (magic bytes)
infer = "0.16"

# S3-compatible storage
aws-sdk-s3 = "1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = "1"

# WASM runtime (interpreter — lightweight, no JIT/cranelift overhead)
wasmi = "0.42"

# Dashboard
dashmap = "6"

# Rate limiting
governor = "0.10"
tower_governor = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
